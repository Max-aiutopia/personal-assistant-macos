<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小光語音</title>
    <link rel="stylesheet" href="voice.css" />
  </head>
  <body>
    <main class="voice-card">
      <header class="voice-header">
        <div class="identity">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <div>
            <strong id="assistant-name">小光</strong>
            <span id="status-label" role="status" aria-live="polite" aria-atomic="true">準備好了</span>
          </div>
        </div>
        <button id="close-button" class="close-button" type="button" aria-label="隱藏語音小視窗">×</button>
      </header>

      <section class="voice-stage">
        <button
          id="voice-orb"
          class="voice-orb"
          type="button"
          aria-label="開始聆聽"
          aria-describedby="prompt"
          aria-pressed="false"
          aria-busy="false"
        >
          <span class="orb-shine" aria-hidden="true"></span>
          <span class="orb-eye left" aria-hidden="true"></span>
          <span class="orb-eye right" aria-hidden="true"></span>
          <span class="orb-mouth" aria-hidden="true"></span>
          <span class="sound-wave wave-one" aria-hidden="true"></span>
          <span class="sound-wave wave-two" aria-hidden="true"></span>
          <span class="sound-wave wave-three" aria-hidden="true"></span>
        </button>
        <p id="prompt">請說，我在聽</p>
      </section>

      <section class="conversation" role="region" aria-label="語音對話" tabindex="0">
        <div class="speech-block user-speech">
          <span class="speech-label">你說</span>
          <p id="transcript">按一下小光，或直接開始說話</p>
        </div>
        <div class="speech-block assistant-speech" role="status" aria-live="polite" aria-atomic="true">
          <span class="speech-label">小光</span>
          <p id="response">你可以叫我新增待辦、記錄日誌或查詢行程。</p>
        </div>
      </section>

      <section class="examples" aria-labelledby="examples-label">
        <span id="examples-label">可以這樣說</span>
        <button type="button" data-example="提醒我明天下午三點打電話給客戶">明天下午三點提醒我…</button>
        <button type="button" data-example="今天有什麼待辦">今天有什麼待辦？</button>
        <button type="button" data-example="記錄一下今天完成了報告">記錄今天完成的事</button>
      </section>

      <footer>
        <span id="shortcut-label">⌥ Space 呼叫</span>
        <span>Esc 隱藏</span>
      </footer>
    </main>
    <script src="voice.js"></script>
  </body>
</html>
